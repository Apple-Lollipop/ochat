name: Desktop builds

on:
  workflow_dispatch:
  push:
    # Populate default-branch caches that every future release tag can restore.
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            platform: windows
            arguments: ''
          - os: ubuntu-24.04
            bundles: deb,appimage
            platform: linux
            arguments: '--config src-tauri/tauri.linux.conf.json'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      RUSTC_WRAPPER: sccache
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Configure compilation parallelism
        run: |
          node -e 'const os=require("node:os"),fs=require("node:fs"); const jobs=Math.max(1,Math.min(4,os.availableParallelism(),Math.floor(os.totalmem()/2**30/4))); fs.appendFileSync(process.env.GITHUB_ENV,`CARGO_BUILD_JOBS=${jobs}\n`); console.log(`Using ${jobs} parallel Rust compilation jobs`);'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - name: Check optional compiler cache
        run: node scripts/ci/compiler-cache.cjs
      - name: Check project and release versions
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release/check-version.cjs
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential cmake libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-pipewire gstreamer1.0-plugins-good
      - run: npm ci
      - name: Verify vendored security patch integrity
        run: node scripts/security/verify-vendored-glib.cjs
      - name: Check interface
        run: npm test 2>&1 | tee ui-tests.log
      - run: cargo fmt --all -- --check
      - name: Check core and peer-to-peer integrations
        run: cargo test -p ochat-core --locked 2>&1 | tee core-tests.log
      - name: Build desktop bundles
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} ${{ matrix.arguments }} -- --locked 2>&1 | tee desktop-build.log
      - name: Show compiler cache stats
        if: ${{ !cancelled() && env.RUSTC_WRAPPER != '' }}
        continue-on-error: true
        run: sccache --show-stats
      - run: node scripts/release/collect.cjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: Ochat-${{ matrix.os }}
          path: releases/${{ matrix.platform == 'windows' && 'Windows' || 'Linux' }}/
          if-no-files-found: error
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ochat-${{ matrix.os }}-logs
          path: |
            ui-tests.log
            core-tests.log
            desktop-build.log
          if-no-files-found: ignore
          retention-days: 7
  macos:
    name: macOS (Apple Silicon)
    uses: ./.github/workflows/macos.yml
  release:
    name: Publish GitHub release
    timeout-minutes: 20
    needs: [desktop, macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@v7
        with:
          name: Ochat-windows-latest
          path: release-input/Windows
      - uses: actions/download-artifact@v7
        with:
          name: Ochat-ubuntu-24.04
          path: release-input/Linux
      - uses: actions/download-artifact@v7
        with:
          name: Ochat-macOS-arm64
          path: release-input/macOS
      - name: Verify all platform bundles and prepare checksums
        run: node scripts/release/prepare.cjs release-input release-upload "$RELEASE_TAG"
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish.cjs release-upload/release-plan.json

