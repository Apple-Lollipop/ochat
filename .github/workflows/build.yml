name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            platform: windows
            arguments: ''
          - os: ubuntu-24.04
            bundles: deb,appimage
            platform: linux
            arguments: '--config src-tauri/tauri.linux.conf.json'
          - os: macos-latest
            bundles: app,dmg
            platform: macos
            arguments: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential cmake libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-pipewire gstreamer1.0-plugins-good
      - run: npm ci
      - name: Verify vendored security patch integrity
        run: node scripts/security/verify-vendored-glib.cjs
      - name: Install universal macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo test -p ochat-core --locked
      - run: npm run tauri -- build --bundles ${{ matrix.bundles }} ${{ matrix.arguments }} -- --locked
      - run: node scripts/release/collect.cjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: Ochat-${{ matrix.os }}
          path: releases/${{ matrix.platform == 'windows' && 'Windows' || matrix.platform == 'linux' && 'Linux' || 'macOS' }}/
          if-no-files-found: error

