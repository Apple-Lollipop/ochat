name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            platform: windows
            arguments: ''
          - os: ubuntu-24.04
            bundles: deb,appimage
            platform: linux
            arguments: '--config src-tauri/tauri.linux.conf.json'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential cmake libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-pipewire gstreamer1.0-plugins-good
      - run: npm ci
      - name: Verify vendored security patch integrity
        run: node scripts/security/verify-vendored-glib.cjs
      - name: Check interface
        run: npm test 2>&1 | tee ui-tests.log
      - run: cargo fmt --all -- --check
      - name: Check core and peer-to-peer integrations
        run: cargo test -p ochat-core --locked 2>&1 | tee core-tests.log
      - name: Build desktop bundles
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} ${{ matrix.arguments }} -- --locked 2>&1 | tee desktop-build.log
      - run: node scripts/release/collect.cjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: Ochat-${{ matrix.os }}
          path: releases/${{ matrix.platform == 'windows' && 'Windows' || 'Linux' }}/
          if-no-files-found: error
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ochat-${{ matrix.os }}-logs
          path: |
            ui-tests.log
            core-tests.log
            desktop-build.log
          if-no-files-found: ignore
          retention-days: 7
  macos:
    name: macOS (Apple Silicon)
    uses: ./.github/workflows/macos.yml

