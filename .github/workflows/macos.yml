name: macOS DMG

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      APPLE_SIGNING_IDENTITY: '-'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CI: 'true'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Configure compilation parallelism
        run: |
          node -e 'const os=require("node:os"),fs=require("node:fs"); const jobs=Math.max(1,Math.min(4,os.availableParallelism(),Math.floor(os.totalmem()/2**30/4))); fs.appendFileSync(process.env.GITHUB_ENV,`CARGO_BUILD_JOBS=${jobs}\n`); console.log(`Using ${jobs} parallel Rust compilation jobs`);'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - name: Check optional compiler cache
        run: node scripts/ci/compiler-cache.cjs
      - name: Check project and release versions
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release/check-version.cjs
      - name: Check native build tools
        run: |
          xcode-select -p
          if ! command -v cmake >/dev/null; then brew install cmake; fi
          cmake --version
          rustc --version
          df -h .
      - run: npm ci
      - name: Verify vendored security patch integrity
        run: node scripts/security/verify-vendored-glib.cjs
      - name: Check interface
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test 2>&1 | tee macos-ui-tests.log
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check core and peer-to-peer integrations
        run: cargo test -p ochat-core --locked 2>&1 | tee macos-core-tests.log
      - name: Check WebKit layouts and macOS keyboard labels
        run: |
          npx playwright install webkit
          node scripts/qa/macos-webkit.cjs 2>&1 | tee macos-webkit-tests.log
      - name: Build arm64 application and DMG
        run: |
          npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg -- --locked 2>&1 | tee macos-build.log
      - name: Show compiler cache stats
        if: ${{ !cancelled() && env.RUSTC_WRAPPER != '' }}
        continue-on-error: true
        run: sccache --show-stats
      - name: Collect DMG and checksums
        id: collect
        run: node scripts/release/collect.cjs macos target/aarch64-apple-darwin/release/bundle/dmg
      - name: Verify architectures and local signature
        id: verify
        run: |
          app="target/aarch64-apple-darwin/release/bundle/macos/Ochat.app"
          test -d "$app"
          lipo "$app/Contents/MacOS/ochat" -verify_arch arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
      - name: Record validation result
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        env:
          VERIFICATION_RESULT: ${{ steps.verify.outcome }}
        run: |
          node -e 'require("node:fs").writeFileSync("releases/macOS/validation.json", JSON.stringify({verification:process.env.VERIFICATION_RESULT,signing:"ad-hoc",notarized:false},null,2)+"\n")'
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        with:
          name: Ochat-macOS-arm64
          path: releases/macOS/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ochat-macOS-build-log
          path: |
            macos-build.log
            macos-ui-tests.log
            macos-core-tests.log
            macos-webkit-tests.log
            releases/reports/macos-webkit-*.png
          if-no-files-found: ignore
          retention-days: 7
