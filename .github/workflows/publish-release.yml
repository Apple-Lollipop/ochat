name: Resume verified release publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
      source_run:
        description: Desktop workflow run with successful Windows, Linux and Mac ARM64 builds
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN: ${{ inputs.source_run }}
      RELEASE_SOURCE_DIR: release-source
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          persist-credentials: false
      - name: Verify original build provenance and successful platform jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/verify-build-run.cjs
      - uses: actions/download-artifact@v7
        with:
          name: Ochat-windows-latest
          path: release-input/Windows
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v7
        with:
          name: Ochat-ubuntu-24.04
          path: release-input/Linux
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v7
        with:
          name: Ochat-macOS-arm64
          path: release-input/macOS
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify all platform bundles and prepare checksums
        run: node scripts/release/prepare.cjs release-input release-upload "$RELEASE_TAG"
      - name: Resume and publish verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish.cjs release-upload/release-plan.json
