[workspace]
members = ["crates/ochat-core", "src-tauri"]
default-members = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[profile.release]
lto = "thin"
strip = true





# GTK3 in Tauri still requires glib 0.18; see vendor/README.md.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
