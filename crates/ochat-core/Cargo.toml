[package]
name = "ochat-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
chrono = "0.4.45"
base64 = "0.22"
blake3 = "1"
bytes = "1"
cpal = "0.18.2"
iroh = "1.4.1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.6"
chacha20poly1305 = "0.11"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
sonora = "0.2"
nnnoiseless = { version = "0.5.2", default-features = false }
opus = "0.4"
rtrb = "0.3"
rubato = "0.16"
fs2 = "0.4"
tempfile = "3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
url = "2"
html5ever = "0.39"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"



[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.26"

[target.'cfg(not(target_os = "windows"))'.dependencies]
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "compression"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }

