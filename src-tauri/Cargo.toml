[package]
name = "ochat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Private peer-to-peer messaging"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ochat-core = { path = "../crates/ochat-core" }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
zeroize = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["sync"] }
uuid = "1"
serde = { version = "1", features = ["derive"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
gstreamer = { version = "0.25", features = ["v1_20"] }
gstreamer-app = { version = "0.25", features = ["v1_20"] }

